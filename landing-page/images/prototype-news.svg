  <text x="44" y="412" fill="#CFD8CD" font-size="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Source: NGJA Assaying Standard Part II • Zero Investment Advice</text>

